<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WhatsApp</title>
  </head>
  <body>
    <!--
      A stand-in for WhatsApp Web's chat list, built to match what
      src/background/inbox/watchers/whatsapp.ts's probe reads: a "Chat list" region holding rows with a
      data-testid of "cell-frame-container", each with a title span (the sender), a secondary span (the
      last message preview) and, only for an unread row, a span whose aria-label ends in
      "unread message"/"unread messages". Real WhatsApp Web's own structure is not guaranteed to match
      this exactly; the probe is written defensively (several selectors, never throws) for that reason.
    -->
    <div aria-label="Chat list">
      <div data-testid="cell-frame-container" data-id="chat-1">
        <div data-testid="cell-frame-title"><span title="Priya Patel">Priya Patel</span></div>
        <div data-testid="cell-frame-secondary"><span title="See you at 3pm?">See you at 3pm?</span></div>
        <span aria-label="2 unread messages">2</span>
      </div>
      <div data-testid="cell-frame-container" data-id="chat-2">
        <div data-testid="cell-frame-title"><span title="Dev Team">Dev Team</span></div>
        <div data-testid="cell-frame-secondary"><span title="Build is green again">Build is green again</span></div>
        <span aria-label="1 unread message">1</span>
      </div>
      <!-- Already read: no unread badge, so the probe must skip it -->
      <div data-testid="cell-frame-container" data-id="chat-3">
        <div data-testid="cell-frame-title"><span title="Mom">Mom</span></div>
        <div data-testid="cell-frame-secondary"><span title="Call me when free">Call me when free</span></div>
      </div>
    </div>
  </body>
</html>
