name: Idea or request
description: Something Ava should do, or do differently.
title: "Idea: "
labels: ["idea", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation and what gets in the way today. The problem matters more than a solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
  - type: checkboxes
    id: fix
    attributes:
      label: Building it
      options:
        - label: I'd like to try building this myself.
