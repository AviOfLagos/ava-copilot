# Every commit in a pull request must carry a Signed-off-by line (the Developer Certificate of Origin, see DCO and
# CONTRIBUTING.md). Read-only: it uses no secrets and posts nothing.
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    name: Commits signed off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every commit for Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit ${c:0:7} has no Signed-off-by line. Amend it with git commit --amend -s (or git rebase --signoff) and push again."
              missing=1
            fi
          done
          exit $missing
